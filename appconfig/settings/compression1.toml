# compression1 settings. A one-shot batch job: it compresses the hdb once and exits, so its
# process.csv row has no port and startwithall=0 - a stack start must not rewrite the hdb.
# Run it on demand:   torqx.sh start compression1
# See kdbx-modules/di/torq/proc/compression.

csvpath = ":appconfig/compressionconfig.csv"   # which table/column gets which algorithm
hdbpath = ":hdb"                               # hdb root, under TORQXDATAHOME
# maxage omitted -> 30, the framework default, as TorQ's own settings file ships
exitonfinish = true                            # terminate when the pass completes

# NOTE: a run against the hdb this repo ships compresses nothing and reports
# "Memory savings from compression: 0.00MB". That is correct, not a failure - its only
# partition is 2015.01.07, far outside the 30-day maxage window. Even in range it would
# compress nothing: its largest column is a few KB, under the 2^17 block size, and kdb does
# not compress a file smaller than one block.
# On a stack that has run EODs the recent partitions ARE in range and do get compressed.
# To see it work against a known partition:
#   torqx.sh start compression1 -hdbpath :/path/to/a/populated/hdb
