# gateway1 settings. The query front end: connects to the rdb + hdb, and routes a client query
# across them, joining the results. A client does:
#   h:hopen`::5306; neg[h](`.gw.asyncexec;"select from trade";`rdb`hdb); h[]
# and gets the rdb's in-memory (today) trades razed with the hdb's on-disk (historical) trades.
# Also gates queries during the wdb's EOD reload. See kdbx-modules/di/torq/proc/gateway.

backendtypes = "rdb hdb idb"   # proctype(s) to connect to and route queries across
# synccallsallowed omitted -> false (deferred-sync / async only)
# errorprefix omitted -> "error: "

# --- service discovery (consumer) -------------------------------------------------------
# Lets discovery1 push newly-seen processes into this gateway's .torq.servers registry.
#
# IMPORTANT: landing in the registry is NOT the same as being routed to. The gateway builds its
# di.serverselect routing table in registerbackends[], which runs only at init and at EOD
# reload-end - not on every registry change. So a backend discovered mid-session sits in the
# registry, connected, but absent from routing until one of those happens. Force it with:
#   h:hopen`::5306; h(`.gw.reload;`reloadend)
# See README section 10 for the full explanation - this is a gateway limitation that predates
# discovery, not something discovery causes.
discoverywant = "rdb hdb"          # only the proctypes this gateway could ever route to

# --- client session tracking ---------------------------------------------------------------
# ⚠️ INERT ON di.torq 0.6.0 (what deps.toml currently pins, and what is on main). The hook that
# reads this section - initclienttracking - landed in di.torq 0.7.0, which is NOT merged yet.
# Until it is, NOTHING reads the keys below: no module loads, no handlers register, and there is
# no warning either, because a process that does not know about a settings section cannot tell
# you it ignored one. The section is kept here so the wiring is ready the moment 0.7.0 lands;
# raise the di.torq pin in deps.toml in that same commit.
#
# Wired generically by di.torq >= 0.7.0 from this section's presence (same opt-in convention as
# [logroll] and [querylog]); absent section = silent no-op. The gateway is the natural host: it is
# the client-facing process, so these are real end-user sessions.
#
# NB: `maxidle` and `trackusage` are accepted but INERT on a stock TorqX stack - they need an owner
# on the .z.pg/.z.ps exec phase, and neither the gateway nor di.torq claims one today. Session
# tracking (open/close, IP, user) works regardless, and is what this demonstrates.
[clienttracking]
enabled = true
retain = "0D02:00:00"
