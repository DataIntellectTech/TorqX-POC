# wdb1 settings. Subscribes to the tickerplant, replays the day's log to disk on startup, then
# during the day incrementally writes trade/quote to a TEMP partition as they fill. At end of
# day it flushes what remains, sorts each partition, moves it into the HDB, and reloads the HDB
# and RDB (rdb1 runs reloadenabled, so it drops its prior day on the reload). Schema comes from
# the tickerplant (via subdetails), not a local database.q. See kdbx-modules/di/torq/proc/wdb.

tickerplanttypes = "segmentedtp"   # classic: "tickerplant"
hdbtypes = "hdb"                   # proctype(s) to move partitions to / reload at EOD
rdbtypes = "rdb"                   # proctype(s) to reload[date] at EOD (drop their prior day)
savedir = "wdb"                    # wdb working-data root (relative to TORQXDATAHOME)
hdbdir = "hdb"                     # HDB root to move sorted partitions into
numrows = 500                      # small threshold so the POC feed triggers intraday flushes
settimer = 5                       # seconds between flush checks
replaylog = true                   # replay the tp log on startup (to disk, bounded memory)
tpwaittimeout = 30000              # ms to block waiting for the tickerplant at startup
reloadorder = "hdb rdb idb"        # reload the hdb first (new partition), then the rdb (drop prior day), then the idb
# immediate omitted -> false (only flush tables over numrows)
# subscribeto / subscribesyms omitted -> all tables, all syms
# ignorelist omitted -> `heartbeat`logmsg
# sortcsv omitted -> di.dbwrite default (sort by time ascending, no attributes)

# Per-table flush thresholds. REQUIRED here: di.torq.proc.wdb 0.3.0 defaults numtab to
# quote`trade!10000 50000, and maxrows prefers numtab over numrows, so without this the
# numrows above is dead for exactly the two tables this demo feeds (0.2.0 defaulted numtab
# to an empty dict, so numrows applied to everything). At the feed's rate trade would need
# ~85 minutes to reach 50000 and nothing would be written intraday.
[numtab]
trade = 500
quote = 500

# Permissions OFF on the wdb, so idb1 can start. The idb reads the wdb's paths as
# (each;value;`.wdb.savedir`...), which the permission model mis-evaluates - TorQ has the same
# defect and the same consequence (see kdbx-modules/di/permissions/permissions.md, "List-form IPC
# messages and eval"). A section replaces rather than merges, so this overrides default.toml.
# TRADE-OFF: the wdb accepts unauthenticated connections. Drop idb1 if that is not acceptable.
[permissions]
enabled = false
