# tickerlogreplay1: replays stp1's logs into hdbreplay. Pick the run on the command line, e.g.
#   torqx.sh start tickerlogreplay1 -replay_tplogdir tplog/stp1_2026.10.05 -replay_hdbdir hdb
# every key is set; each is overridable as -replay_<key>
"replay_schemafile" = "database.q"
"replay_hdbdir" = "hdbreplay"
"replay_tplogdir" = ""
"replay_tplogfile" = ""                         # a single log file instead of tplogdir
"replay_segmentedmode" = true                   # tplogdir is a segmented tickerplant log directory
"replay_tablelist" = "all"
"replay_firstmessage" = 0
"replay_lastmessage" = 9223372036854775807      # 0W
"replay_messagechunks" = 9223372036854775807    # 0W
"replay_partitiontype" = "date"
"replay_clean" = true
"replay_emptytables" = true
"replay_sortafterreplay" = true
"replay_sortcsv" = ""
"replay_basicmode" = false
"replay_checklogfiles" = false
"replay_gc" = true
"replay_autoreplay" = true
"replay_exitwhencomplete" = true
"replay_partandmerge" = false
"replay_tempdir" = "tempmergedir"
"replay_mergemethod" = "part"
"replay_mergenumrows" = 10000000
"replay_mergenumbytes" = 500000000
